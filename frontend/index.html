<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SmartHome · Gerenciador de Energia</title>
    <link rel="icon" href="/favicon.svg" />
    <script>
      // Tema ANTES da primeira pintura. `main.ts` e um modulo (deferido): se a
      // classe so fosse aplicada la, quem escolheu escuro veria um lampejo
      // branco a cada carregamento. `themeMode` e a chave que o
      // `basecoat.theme.set()` ja usa — nao inventamos outra.
      // PADRAO: claro. Ausencia de escolha nao consulta o sistema operacional.
      try {
        if (localStorage.getItem('themeMode') === 'dark') {
          document.documentElement.classList.add('dark');
        }
      } catch (_) { /* localStorage bloqueado: segue no claro */ }
    </script>
  </head>
  <body>
    <!--
      Casca do Basecoat `sidebar`: o elemento `.sidebar` fica com largura zero no
      desktop (o `<nav>` dentro dele e `position: fixed`) e vira o veu escuro no
      celular. O irmao seguinte recebe `ml-(--sidebar-width)` da propria
      biblioteca — por isso o `<main>` PRECISA ser o irmao imediato.

      `data-sidebar-initialized` e `aria-hidden` sao escritos AQUI, e nao pelo JS
      do Basecoat: usamos o CSS dele, mas o estado e nosso (ver `main.ts`,
      "Barra lateral"). A CSS da biblioteca esconde a barra no celular enquanto o
      atributo de inicializacao nao existir, entao ele precisa vir do HTML.
    -->
    <div id="root">
      <div id="sidebar" class="sidebar" data-side="left" data-sidebar-initialized="true" aria-hidden="false"></div>
      <main class="flex min-w-0 flex-1 flex-col overflow-hidden">
        <div id="topbar"></div>
        <div id="view" class="flex-1 overflow-y-auto"></div>
      </main>
      <!-- Seletor de tema: fixo no canto superior direito, presente tambem na
           tela de login. No celular a barra do topo ganha respiro a direita
           (`pe-14`) para o numero de watts nao passar por baixo dele. -->
      <button id="tema" type="button" class="btn fixed end-4 top-3 z-30 md:end-6 md:top-5"
        data-variant="outline" data-size="icon"></button>
      <div id="toaster" class="toaster" data-align="center"></div>
      <div id="modal"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
