# Workspace próprio: isola o backend (alvo host) do workspace esp-idf da raiz
# (firmware/Xtensa + tomada-solver). Ver plan.md / research.md §1.
[workspace]

[package]
name = "backend"
version = "0.1.0"
edition = "2021"
description = "Backend próprio (Actix-Web + MySQL) — feature 004"

[lib]
name = "backend"
path = "src/lib.rs"

[[bin]]
name = "backend"
path = "src/main.rs"

[dependencies]
actix-web = "4"
actix-cors = "0.7"
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-rustls", "mysql", "chrono", "json", "migrate"] }
jsonwebtoken = "9"
argon2 = "0.5"
sha2 = "0.10"
hex = "0.4"
rand = "0.8"
uuid = { version = "1", features = ["v4"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
dotenvy = "0.15"
log = "0.4"
env_logger = "0.11"

[dev-dependencies]
actix-rt = "2.11.0"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread"] }
