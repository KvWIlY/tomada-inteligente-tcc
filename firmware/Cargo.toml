[package]
name = "y-firmware"
version = "0.1.0"
edition = "2021"
resolver = "2"
rust-version = "1.82"

[[bin]]
name = "y-firmware"
harness = false

# Profiles ficam no Cargo.toml RAIZ do workspace (../Cargo.toml).

[dependencies]
log           = "0.4"
esp-idf-svc   = { version = "0.52.1", features = ["std", "binstart"] }
embedded-svc  = "0.29"
serde         = { version = "1", features = ["derive"] }
serde_json    = "1"
anyhow        = "1"
dotenvy_macro = "0.15"
chrono        = { version = "0.4", default-features = false, features = ["clock"] }

[build-dependencies]
embuild = "0.33"

[package.metadata.esp-idf-sys]
extra_components = [
  { remote_component = { name = "joltwallet/littlefs", version = "1.21.1" } }
]
